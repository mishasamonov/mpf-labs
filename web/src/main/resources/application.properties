spring.application.name=mpf-labs
# Render passes the port of the web service in PORT; 8080 is the local default.
server.port=${PORT:8080}
spring.main.web-application-type=servlet
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true
server.servlet.session.tracking-modes=cookie
spring.mvc.servlet.load-on-startup=1
# Render terminates HTTPS at its proxy: trust X-Forwarded-* for redirects and links.
server.forward-headers-strategy=framework
app.base-url=${APP_BASE_URL:http://localhost:8080}

# ==== Actuator ====
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=never
management.info.env.enabled=true
info.app.name=BookApp (mpf-labs)
info.app.description=Complex lab: Spring Boot on Render with managed PostgreSQL
info.app.version=@project.version@

spring.messages.basename=messages
spring.messages.encoding=UTF-8
spring.messages.fallback-to-system-locale=false

# ==== Thymeleaf ====
spring.thymeleaf.cache=true
spring.thymeleaf.encoding=UTF-8
spring.thymeleaf.mode=HTML
spring.thymeleaf.servlet.content-type=text/html
catalog.clock-zone=Europe/Kyiv

# ==== DATABASE: PostgreSQL ====
# Secrets are never stored in the repository: Render passes them as environment variables.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/mpf_labs}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:mpf_user}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:mpf_pass}
# Free Render PostgreSQL allows few connections: a small Hikari pool is enough.
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:5}

# Hibernate only checks the schema; Flyway owns it.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# ==== Flyway ====
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# ==== Email via Resend (HTTP API) ====
# Render blocks SMTP ports 465/587. The key comes from RESEND_API_KEY and never from GitHub.
mail.resend.api-key=${RESEND_API_KEY:}
mail.resend.from=${MAIL_FROM:Book App <onboarding@resend.dev>}
# Where service letters (a new book) go.
app.mail.admin=${APP_MAIL_ADMIN:reader@localhost.test}

# FreeMarker is used only for email; Thymeleaf continues to resolve MVC pages.
spring.freemarker.enabled=false

# ==== Logging (production) ====
logging.level.sumdu.edu.ua=INFO
logging.level.org.flywaydb.core=INFO
logging.level.org.hibernate.SQL=WARN
logging.level.org.hibernate.orm.jdbc.bind=WARN
logging.level.SECURITY_AUDIT=INFO
logging.level.org.springframework.security=INFO
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
