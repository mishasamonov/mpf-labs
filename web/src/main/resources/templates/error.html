<!DOCTYPE html>
<html lang="uk" xmlns:th="http://www.thymeleaf.org" th:lang="${#locale.language}">
<head th:replace="~{fragments/head :: head(#{error.title})}"></head>
<body>
<header th:replace="~{fragments/header :: header}"></header>
<main class="narrow error-page">
  <p class="status-code" th:text="${status}"></p>
  <h1 th:text="#{error.title}"></h1>
  <p class="intro" th:text="${messageKey != null ? #messages.msg(messageKey) : #messages.msg('error.request')}"></p>
  <p class="error-box" th:if="${detail != null}">
    <strong th:text="#{error.detail}"></strong> <span th:text="${detail}"></span>
  </p>
  <p class="muted" th:if="${path != null}" th:text="#{error.path(${path})}"></p>
  <a class="button" th:href="@{/books}" th:text="#{comments.back}"></a>
</main>
<footer th:replace="~{fragments/footer :: footer}"></footer>
</body>
</html>
