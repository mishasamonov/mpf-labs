<div xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
     th:fragment="header" class="site-header">
  <a class="brand" th:href="@{/books}" th:text="#{app.name}">Книжкова полиця</a>
  <nav th:aria-label="#{nav.main}">
    <a sec:authorize="isAuthenticated()" th:href="@{/books}" th:text="#{title.books}">Каталог книг</a>
    <a sec:authorize="hasRole('ADMIN')" th:href="@{/books/add}" th:text="#{form.add}">Додати книгу</a>
    <a sec:authorize="hasRole('ADMIN')" th:href="@{/users}" th:text="#{nav.users}">Користувачі</a>
    <span class="languages" th:aria-label="#{nav.language}">
      <a th:href="@{''(lang='uk',bookId=${param.bookId},q=${param.q})}" lang="uk" th:classappend="${#locale.language == 'uk'} ? 'active'">UA</a>
      <a th:href="@{''(lang='en',bookId=${param.bookId},q=${param.q})}" lang="en" th:classappend="${#locale.language == 'en'} ? 'active'">EN</a>
      <a th:href="@{''(lang='fr',bookId=${param.bookId},q=${param.q})}" lang="fr" th:classappend="${#locale.language == 'fr'} ? 'active'">FR</a>
    </span>
    <span class="account" sec:authorize="isAuthenticated()">
      <span class="who">
        <strong class="nickname" th:text="${currentUserNickname != null ? currentUserNickname : #authentication.name}">nickname</strong>
        <span class="principal" th:text="${#authentication.name}">principal.name</span>
      </span>
      <span class="role role-admin" sec:authorize="hasRole('ADMIN')">ADMIN</span>
      <span class="role" sec:authorize="hasRole('USER')">USER</span>
      <form class="logout" method="post" th:action="@{/logout}">
        <button class="secondary" type="submit" th:text="#{auth.logout}">Вийти</button>
      </form>
    </span>
    <span class="account" sec:authorize="isAnonymous()">
      <a th:href="@{/login}" th:text="#{nav.login}">Увійти</a>
      <a class="button small" th:href="@{/register}" th:text="#{nav.register}">Реєстрація</a>
    </span>
  </nav>
</div>
