# Local development in IntelliJ: PostgreSQL from compose.yaml, visible SQL, no template cache.
server.port=${PORT:8088}
app.base-url=${APP_BASE_URL:http://localhost:8088}
spring.thymeleaf.cache=false
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
logging.level.org.hibernate.SQL=DEBUG
# Bound values are not logged: they would contain password hashes and tokens.
logging.level.org.hibernate.orm.jdbc.bind=INFO
logging.level.org.springframework.orm.jpa.JpaTransactionManager=DEBUG
