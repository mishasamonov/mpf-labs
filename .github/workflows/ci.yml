name: Java CI with Maven

# Development goes to predeploy; only a green build is promoted to deploy, which Render watches.
on:
  push:
    branches: [ "predeploy" ]
  pull_request:
    branches: [ "predeploy" ]

permissions:
  contents: write   # promote-to-render pushes to the deploy branch

jobs:
  build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine   # Flyway 10.10 (Spring Boot 3.3.4) supports PostgreSQL up to 16
        env:
          POSTGRES_DB: mpf_labs
          POSTGRES_USER: mpf_user
          POSTGRES_PASSWORD: mpf_pass
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U mpf_user -d mpf_labs"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/mpf_labs
      SPRING_DATASOURCE_USERNAME: mpf_user
      SPRING_DATASOURCE_PASSWORD: mpf_pass

    steps:
      - uses: actions/checkout@v5
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven
      - name: Unit and PostgreSQL tests (mvn test)
        run: mvn -B test --file pom.xml
      - name: Integration tests and web JAR (mvn verify)
        # Surefire tests already passed in the previous step; failsafe runs the *IT classes.
        run: mvn -B verify -pl web -am -Dtest=NoSuchTest -Dsurefire.failIfNoSpecifiedTests=false
      - name: Upload web JAR
        uses: actions/upload-artifact@v5
        with:
          name: mpf-labs-web-jar
          path: web/target/web-*.jar
          if-no-files-found: error

  promote-to-render:
    needs: build
    runs-on: ubuntu-latest
    # Runs only after a successful build of a push (not of a pull request).
    if: github.event_name == 'push' && needs.build.result == 'success'
    steps:
      - name: Checkout repo with all branches
        uses: actions/checkout@v5
        with:
          fetch-depth: 0  # all branches
      - name: Configure Git user
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
      - name: Merge predeploy -> deploy (fast-forward only)
        run: |
          git checkout deploy
          git fetch origin
          git merge --ff-only origin/predeploy
          git push origin deploy
