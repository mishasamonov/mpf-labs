# Local PostgreSQL with the same database, user and password as the defaults in application.properties.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: mpf_labs
      POSTGRES_USER: mpf_user
      POSTGRES_PASSWORD: mpf_pass
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - mpf-labs-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mpf_user -d mpf_labs"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  mpf-labs-pg:
